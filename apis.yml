name: Internet Brands
description: Internet Brands is a KKR-owned digital media and software company, founded in 1998 and
  headquartered in El Segundo, California, that operates a portfolio of vertical franchises across health,
  dental, legal, and auto/home/travel markets. Its brands include WebMD and Medscape (health), WebMD Ignite
  and PulsePoint (health engagement), Henry Schein One and Dentrix (dental SaaS), FindLaw and Avvo (legal),
  and CarsDirect and Fodor's (auto, home, and travel). It was surfaced as a portfolio company of Battery
  Ventures and Redpoint Ventures and added to the API Evangelist network. The holding company does not
  publish a single unified public developer API; developer surfaces live with its individual operating brands.
